[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aibi"
version = "0.1.0"
description = "Documented collection and filtration of AI-generated images for propagandistic/high-affect motifs and social-media engagement"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pydantic>=2.5",
  "pyyaml>=6",
  "pillow>=10",
  "imagehash>=4.3",
  "pandas>=2.0",
  "pyarrow>=14",
]

[project.optional-dependencies]
clip = ["open_clip_torch>=2.24", "torch>=2.1"]
vlm = ["anthropic>=1.15"]
gemini = ["google-genai>=2.31"]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
aibi = "aibi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aibi = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
